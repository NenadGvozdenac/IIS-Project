<div class="ticket-item">
    <div class="ticket-header">🏆 {{TicketName}}</div>
    <div class="ticket-details">
        <p><strong>Season:</strong> {{SeasonName}}</p>
        <p><strong>Season Start:</strong> {{SeasonStart}}</p>
        <p><strong>Season End:</strong> {{SeasonEnd}}</p>
        <p><strong>Zone:</strong> {{ZoneName}} (ID: {{ZoneId}})</p>
        <p><strong>Seat:</strong> Row {{SeatRow}}, Number {{SeatNumber}} (ID: {{SeatId}})</p>
        <p><strong>Direction:</strong> {{SeatDirection}}</p>
        <p><strong>Price:</strong> <span style="color: #28a745; font-weight: bold;">{{Price}} RSD</span></p>
    </div>
</div>

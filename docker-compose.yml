services:
  auth_service:
    build:
      context: .
      dockerfile: backend/auth_service/Dockerfile
    ports:
      - "8080:8080" # Web UI
    environment:
      - DB_HOST=postgres_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=sportsdb
      - DB_PORT=5432
      - TICKET_SERVICE_URL=https://ticket_service:5005
    depends_on:
      - postgres_db

  match_service:
    image: ${DOCKER_REGISTRY-}matchservice
    build:
      context: .
      dockerfile: backend/match_service/Dockerfile
    ports:
      - "5000:5000"
      - "5001:5001" # Web UI
    depends_on:
      - postgres_db
      - influxdb
    environment:
      - InfluxDB__Url=http://influxdb:8086
      - InfluxDB__Token=basketball-events-token-2024
      - InfluxDB__Org=basketball_org
      - InfluxDB__Bucket=events_bucket

  scouting_service:
    image: ${DOCKER_REGISTRY-}scoutingservice
    build:
      context: .
      dockerfile: backend/scouting_service/Dockerfile
    ports:
      - "5002:5002"
      - "5003:5003" # Web UI
    depends_on:
      - postgres_db
      - elasticsearch

  ticket_service:
    image: ${DOCKER_REGISTRY-}ticketservice
    build:
      context: .
      dockerfile: backend/ticket_service/Dockerfile
    ports:
      - "5004:5004"
      - "5005:5005" # Web UI
    volumes:
      - ./database/graph_database:/database/graph_database:ro
    depends_on:
      - postgres_db
      - neo4j

  travel_service:
    image: ${DOCKER_REGISTRY-}travelservice
    build:
      context: .
      dockerfile: backend/travel_service/Dockerfile
    ports:
      - "5006:5006"
      - "5007:5007" # Web UI
    depends_on:
      - postgres_db

  elasticsearch_service:
    image: ${DOCKER_REGISTRY-}elasticsearchservice
    build:
      context: .
      dockerfile: backend/elasticsearch_service/Dockerfile
    ports:
      - "5008:5008"
    depends_on:
      - elasticsearch

  elastic_orchestrator_service:
    image: ${DOCKER_REGISTRY-}elasticorchestratorservice
    build:
      context: .
      dockerfile: backend/elastic_orchestrator_service/Dockerfile
    ports:
      - "5010:5010"
    depends_on:
      - scouting_service
      - elasticsearch_service

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.18
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  postgres_db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sportsdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

  influxdb:
    image: influxdb:2.7.6
    ports:
      - '8086:8086'
    volumes:
      - influxdb_storage:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=basketballclub
      - DOCKER_INFLUXDB_INIT_PASSWORD=basketballclub123
      - DOCKER_INFLUXDB_INIT_ORG=basketball_org
      - DOCKER_INFLUXDB_INIT_BUCKET=events_bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=basketball-events-token-2024

  neo4j:
    image: neo4j:5.23
    container_name: neo4j
    restart: always
    ports:
      - "7474:7474" # Web UI
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
      - ./database/graph_database/neo4j_init.cql:/docker-entrypoint-initdb.d/neo4j_init.cql
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.vite
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  influxdb_storage:
  es_data:  
  elasticsearch_data:

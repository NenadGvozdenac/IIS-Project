services:
  auth_service:
    build:
      context: .
      dockerfile: backend/auth_service/Dockerfile
    ports:
      - "8080:8080" # Web UI
    environment:
      - DB_HOST=postgres_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=sportsdb
      - DB_PORT=5432
      - TICKET_SERVICE_URL=https://ticket_service:5005
    depends_on:
      - postgres_db

  match_service:
    image: ${DOCKER_REGISTRY-}matchservice
    build:
      context: .
      dockerfile: backend/match_service/Dockerfile
    ports:
      - "5000:5000"
      - "5001:5001" # Web UI
    depends_on:
      - postgres_db
      - influxdb
      - rabbitmq
    environment:
      - InfluxDB__Url=http://influxdb:8086
      - InfluxDB__Token=basketball-events-token-2024
      - InfluxDB__Org=basketball_org
      - InfluxDB__Bucket=events_bucket
      - ConnectionStrings__RabbitMQ=amqp://guest:guest@rabbitmq:5672

  scouting_service:
    image: ${DOCKER_REGISTRY-}scoutingservice
    build:
      context: .
      dockerfile: backend/scouting_service/Dockerfile
    ports:
      - "5002:5002"
      - "5003:5003" # Web UI
    depends_on:
      - postgres_db

  ticket_service:
    image: ${DOCKER_REGISTRY-}ticketservice
    build:
      context: .
      dockerfile: backend/ticket_service/Dockerfile
    ports:
      - "5004:5004"
      - "5005:5005" # Web UI
    volumes:
      - ./database/graph_database:/database/graph_database:ro
    depends_on:
      - postgres_db
      - neo4j

  travel_service:
    image: ${DOCKER_REGISTRY-}travelservice
    build:
      context: .
      dockerfile: backend/travel_service/Dockerfile
    ports:
      - "5006:5006"
      - "5007:5007" # Web UI
    depends_on:
      - postgres_db
      - cassandra
      - rabbitmq
    environment:
      - ConnectionStrings__RabbitMQ=amqp://guest:guest@rabbitmq:5672

  postgres_db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sportsdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

  influxdb:
    image: influxdb:2.7.6
    ports:
      - '8086:8086'
    volumes:
      - influxdb_storage:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=basketballclub
      - DOCKER_INFLUXDB_INIT_PASSWORD=basketballclub123
      - DOCKER_INFLUXDB_INIT_ORG=basketball_org
      - DOCKER_INFLUXDB_INIT_BUCKET=events_bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=basketball-events-token-2024

  neo4j:
    image: neo4j:5.23
    container_name: neo4j
    restart: always
    ports:
      - "7474:7474" # Web UI
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
      - ./database/graph_database/neo4j_init.cql:/docker-entrypoint-initdb.d/neo4j_init.cql

  cassandra:
    image: cassandra:4.1
    container_name: cassandra-travel
    restart: always
    ports:
      - "9042:9042" # Native transport port
    environment:
      - CASSANDRA_CLUSTER_NAME=travel_cluster
      - CASSANDRA_KEYSPACE=travel_analytics
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-u", "cassandra", "-p", "cassandra", "-e", "describe cluster"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 240s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.vite
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  influxdb_storage:
  cassandra_data:
  rabbitmq_data:
